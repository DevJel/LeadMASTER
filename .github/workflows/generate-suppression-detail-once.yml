name: Generate suppression detail assets once
on:
  push:
    branches: [feature/dispatch-suppression-review-20261109]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dispatch-suppression-review-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate assets on this branch only
        run: |
          node scripts/apply-suppression-detail.mjs
          node scripts/build-static-assets.mjs
          node --test test/message-detail-ui.test.mjs
          git rm .github/workflows/generate-suppression-detail-once.yml scripts/apply-suppression-detail.mjs
          git add 'src/Mandatory LeadMASTER Dashboard.html' public/dashboard.html src/static-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate message error dashboard assets'
          git push origin HEAD:feature/dispatch-suppression-review-20261109
