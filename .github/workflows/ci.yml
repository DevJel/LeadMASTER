name: LeadMASTER CI
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:assets
      - name: Commit generated asset bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- src/static-assets.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/static-assets.mjs
            git commit -m "chore: sync generated static assets"
            git push
          fi
      - name: Verify generated asset bundle
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: git diff --exit-code -- src/static-assets.mjs
      - name: Syntax-check account and route modules
        run: |
          node --check worker.js
          node --check src/developer-api.mjs
          node --check src/developer-webhooks.mjs
          node --check workers/mail-queue-consumer.js
          node --check workers/mail-failed-consumer.js
          node --check workers/inbound-mail.js
          node --check test/account-isolation.test.mjs
          node --check scripts/capture-screenshots.mjs

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: leadmaster-ui-screenshots
          path: docs/screenshots/generated/*.png
          if-no-files-found: error
          retention-days: 30
