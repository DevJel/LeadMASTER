name: LeadMASTER CI
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:assets
      - name: Ensure generated asset bundle is committed
        run: git diff --exit-code -- src/static-assets.mjs
      - name: Syntax-check account and route modules
        run: |
          node --check worker.js
          node --check src/developer-api.mjs
          node --check src/developer-webhooks.mjs
          node --check test/account-isolation.test.mjs
