name: Generate compose group assets once
on:
  push:
    branches: [feature/compose-groups-20261109]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-groups-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate assets on this branch only
        run: |
          node scripts/apply-compose-groups.mjs
          node scripts/build-static-assets.mjs
          node --test test/compose-groups.test.mjs
          git rm .github/workflows/generate-compose-groups-once.yml scripts/apply-compose-groups.mjs src/group-compose-replacement.html
          git add 'src/Mandatory LeadMASTER Dashboard.html' public/dashboard.html src/static-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate composer group controls and assets'
          git push origin HEAD:feature/compose-groups-20261109
