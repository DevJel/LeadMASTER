name: Generate composer branch assets once
on:
  push:
    branches: [feature/compose-import-templates-20261109]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-import-templates-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update canonical dashboard and generated assets
        run: |
          node scripts/apply-import-template-ui.mjs
          node scripts/build-static-assets.mjs
          git rm .github/workflows/generate-compose-once.yml scripts/apply-import-template-ui.mjs src/compose-panel-replacement.html
          git add 'src/Mandatory LeadMASTER Dashboard.html' public/dashboard.html src/static-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate import and template composer assets'
          git push origin HEAD:feature/compose-import-templates-20261109
