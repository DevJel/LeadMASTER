name: Generate rate documentation assets once
on:
  push:
    branches: [feature/batch-progress-20261109]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/batch-progress-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild bundled assets for this branch
        run: |
          node scripts/build-static-assets.mjs
          git rm .github/workflows/generate-rate-docs-once.yml
          git add src/static-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate landing documentation assets'
          git push origin HEAD:feature/batch-progress-20261109
