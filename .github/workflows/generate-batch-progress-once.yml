name: Generate batch progress assets once
on:
  push:
    branches: [feature/sent-batch-progress-20261109]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sent-batch-progress-20261109
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate assets on this branch only
        run: |
          node scripts/apply-batch-progress.mjs
          node scripts/build-static-assets.mjs
          node --test test/batch-progress-ui.test.mjs test/batch-progress.test.mjs
          git rm .github/workflows/generate-batch-progress-once.yml scripts/apply-batch-progress.mjs
          git add 'src/Mandatory LeadMASTER Dashboard.html' public/dashboard.html src/static-assets.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate batch progress dashboard and assets'
          git push origin HEAD:feature/sent-batch-progress-20261109
