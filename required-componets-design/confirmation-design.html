<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadMaster — Confirm Delete</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px}
  .demo-btn{border:0;background:#000;color:#fff;font:600 14px/1 system-ui;padding:13px 22px;border-radius:99px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .demo-btn:active{transform:scale(.98)}
  .lm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .lm-overlay.open{display:flex;animation:lm-fade .25s ease both}
  @keyframes lm-fade{from{opacity:0}to{opacity:1}}
  .lm-modal{width:100%;max-width:400px;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:28px 24px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.22);position:relative;overflow:hidden}
  .lm-overlay.open .lm-modal{animation:lm-pop .38s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes lm-pop{0%{transform:scale(.85) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  .lm-modal::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:4px;background:#000;transform-origin:left;animation:lm-bar 2.2s ease-in-out infinite}
  @keyframes lm-bar{0%{transform:scaleX(0)}50%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
  .lm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;font-size:16px;line-height:1;cursor:pointer;color:#000}
  .lm-close:hover{background:#f5f5f5}
  .lm-icon-wrap{width:72px;height:72px;margin:6px auto 14px;border-radius:50%;border:1.8px solid #000;display:grid;place-items:center;position:relative;background:#fff}
  .lm-icon-wrap::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.2px dashed #000;animation:lm-ring 2.2s ease-out infinite}
  @keyframes lm-ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.15);opacity:0}}
  .lm-trash{animation:lm-shake 2.2s ease-in-out infinite;transform-origin:50% 0}
  @keyframes lm-shake{0%,88%,100%{transform:rotate(0)}90%{transform:rotate(-6deg)}92%{transform:rotate(5deg)}94%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}98%{transform:rotate(0)}}
  .lm-title{margin:0;font:700 19px/1.35 system-ui;color:#000}
  .lm-sub{margin:8px 0 0;font:400 13px/1.6 system-ui;color:#6b7280}
  .lm-sub b{color:#000}
  .lm-item{margin:16px auto 0;max-width:300px;display:flex;align-items:center;gap:10px;text-align:left;background:#fafafa;border:1px solid #e5e5e5;border-radius:12px;padding:10px 12px}
  .lm-item .av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}
  .lm-item .av svg{width:20px;height:20px}
  .lm-item p{margin:0;line-height:1.35}
  .lm-item .n{font:600 13px/1.35 system-ui;color:#000}
  .lm-item .e{font:400 11px/1.35 system-ui;color:#6b7280}
  .lm-actions{margin-top:20px;display:flex;gap:10px}
  .lm-btn{flex:1;border-radius:99px;padding:13px 10px;font:600 14px/1 system-ui;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .lm-btn:active{transform:scale(.97)}
  .lm-no{background:#fff;color:#000;border:1.8px solid #000}
  .lm-no:hover{background:#f5f5f5}
  .lm-yes{background:#000;color:#fff;border:1.8px solid #000;position:relative;overflow:hidden}
  .lm-yes:hover{box-shadow:0 8px 20px rgba(0,0,0,.22)}
  .lm-yes .fill{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .35s}
  .lm-yes:hover .fill{transform:scaleX(1)}
  .lm-yes span{position:relative;z-index:1}
  .lm-yes:hover span{color:#000}
  .lm-note{margin:12px 0 0;font:400 11px/1.5 system-ui;color:#9ca3af}
  .lm-toast{display:none;margin-top:16px;background:#000;color:#fff;padding:11px 16px;border-radius:99px;font:600 13px/1.4 system-ui;animation:lm-toast .3s ease both}
  .lm-toast.show{display:inline-block}
  @keyframes lm-toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .lm-modal.deleting .lm-trash{animation:lm-trashout .6s ease both}
  @keyframes lm-trashout{to{transform:translateY(8px) scale(.8);opacity:0}}
  @media (prefers-reduced-motion:reduce){.lm-overlay,.lm-modal,.lm-icon-wrap::after,.lm-trash,.lm-modal::before,.lm-yes .fill{animation:none!important}}
</style>
</head>
<body>
<button class="demo-btn" type="button" onclick="openConfirm()">Delete Item — Demo</button>

<div class="lm-overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="lm-modal" id="modal">
    <button class="lm-close" type="button" aria-label="Close" onclick="closeConfirm()">×</button>
    <div class="lm-icon-wrap" aria-hidden="true">
      <svg class="lm-trash" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
    </div>
    <p class="lm-title" id="confirmTitle">Do you really want to delete this item?</p>
    <p class="lm-sub">This action cannot be undone.<br/>The item will be moved to <b>Deleted</b>.</p>
    <div class="lm-item">
      <span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      <p><span class="n">Sarah Chen — Q4 Proposal</span><br/><span class="e">sarah@acme.com • Inbox</span></p>
    </div>
    <div class="lm-actions">
      <button class="lm-btn lm-no" type="button" onclick="chooseNo()">NO, Keep it</button>
      <button class="lm-btn lm-yes" type="button" onclick="chooseYes()"><span class="fill"></span><span>YES, Delete</span></button>
    </div>
    <p class="lm-note">Tip: Press <b>Esc</b> for No • <b>Enter</b> for Yes</p>
    <div class="lm-toast" id="toast">✓ Deleted — moved to Deleted</div>
  </div>
</div>

<script>
  const overlay=document.getElementById('overlay'), modal=document.getElementById('modal'), toast=document.getElementById('toast');
  function openConfirm(){ toast.classList.remove('show'); modal.classList.remove('deleting'); overlay.classList.add('open'); }
  function closeConfirm(){ overlay.classList.remove('open'); }
  function chooseNo(){ closeConfirm(); }
  function chooseYes(){
    modal.classList.add('deleting');
    setTimeout(()=>{ modal.classList.remove('deleting'); toast.classList.add('show'); },620);
    setTimeout(closeConfirm,1800);
  }
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeConfirm(); });
  document.addEventListener('keydown',e=>{
    if(!overlay.classList.contains('open')) return;
    if(e.key==='Escape') chooseNo();
    if(e.key==='Enter') chooseYes();
  });
  openConfirm();
</script>
</body>
</html>
