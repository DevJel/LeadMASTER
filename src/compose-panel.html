<section id="lm-compose-page" class="lm-compose" aria-labelledby="lm-compose-title" hidden>
  <header class="lm-compose__header">
    <div class="lm-compose__brand">LeadMASTER <span>/</span> Emails</div>
    <button type="button" id="lm-compose-close" class="lm-compose__back" aria-label="Return to dashboard">← &nbsp;Back to dashboard</button>
  </header>
  <main class="lm-compose__main">
    <div class="lm-compose__heading"><div><p class="lm-compose__eyebrow">EMAILS</p><h1 id="lm-compose-title" tabindex="-1">Compose email</h1><p>Write a message and add it to the sending list.</p></div><span class="lm-compose__status-label">New message</span></div>
    <form id="lm-compose-form">
      <div class="lm-compose__row"><label for="lm-compose-to">To</label><div><input id="lm-compose-to" name="to" required autocomplete="off" placeholder="name@example.com, another@example.com" aria-describedby="lm-compose-recipients-help"><p id="lm-compose-recipients-help" class="lm-compose__help">Separate addresses with commas. Up to 500 recipients.</p></div></div>
      <div class="lm-compose__row"><label for="lm-compose-from">From</label><div class="lm-compose__from"><select id="lm-compose-from" name="fromEmail"><option value="hello@work.jelvan.pro">hello@work.jelvan.pro</option><option value="hello@operavaglobal.com">hello@operavaglobal.com</option></select><label class="lm-compose__inline-label" for="lm-compose-name">Display name</label><input id="lm-compose-name" name="fromName" value="Jelvan Ricolcol" maxlength="64"></div></div>
      <div class="lm-compose__row"><label for="lm-compose-subject">Subject</label><input id="lm-compose-subject" name="subject" required maxlength="300" placeholder="Add a subject"></div>
      <div class="lm-compose__body"><label for="lm-compose-message">Message</label><textarea id="lm-compose-message" name="text" required maxlength="200000" placeholder="Write your email…"></textarea></div>
      <div class="lm-compose__footer"><div><p class="lm-compose__help">Plain text · Immediate sending</p><p class="lm-compose__help">Scheduling, groups, HTML and attachments are not available yet.</p></div><button id="lm-compose-send" type="submit">Add to sending list</button></div>
      <p id="lm-compose-status" class="lm-compose__feedback" role="status" aria-live="polite"></p>
    </form>
  </main>
</section>
<style>
.lm-compose[hidden]{display:none!important}.lm-compose{min-height:100vh;background:#f7f8fa;color:#20252c;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}.lm-compose *{box-sizing:border-box}.lm-compose-open #root,.lm-compose-open #html-preview{display:none!important}.lm-compose__header{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 40px;background:white;border-bottom:1px solid #e1e5e9}.lm-compose__brand{font-weight:700;font-size:15px}.lm-compose__brand span{margin:0 9px;color:#9aa3ae;font-weight:400}.lm-compose__back{border:0;background:transparent;color:#465664;font:inherit;font-size:14px;cursor:pointer;padding:12px 0}.lm-compose__main{max-width:1060px;margin:auto;padding:36px 32px 56px}.lm-compose__heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.lm-compose__heading h1{font-size:30px;letter-spacing:-.035em;line-height:1.2;margin:4px 0 8px;font-weight:700}.lm-compose__heading p{margin:0;color:#687584;font-size:15px}.lm-compose__heading .lm-compose__eyebrow{font-size:12px;color:#556b80;letter-spacing:.12em;font-weight:700}.lm-compose__status-label{font-size:13px;color:#546678;background:#edf2f7;padding:6px 11px;border-radius:5px;white-space:nowrap}.lm-compose form{background:white;border:1px solid #dfe5ea;border-radius:8px;box-shadow:0 3px 14px rgba(25,39,55,.04);overflow:hidden}.lm-compose__row{display:grid;grid-template-columns:105px minmax(0,1fr);gap:16px;align-items:start;padding:17px 24px;border-bottom:1px solid #e8ecef}.lm-compose__row>label,.lm-compose__body>label{font-size:14px;font-weight:650;color:#53616d;padding-top:10px}.lm-compose input,.lm-compose select,.lm-compose textarea{font:inherit;color:#20252c;background:white;border:1px solid transparent;border-radius:4px;outline:none;min-width:0;width:100%;padding:9px 10px}.lm-compose input:focus,.lm-compose select:focus,.lm-compose textarea:focus{border-color:#2783de;box-shadow:0 0 0 3px #e5f2fc}.lm-compose input::placeholder,.lm-compose textarea::placeholder{color:#8995a2}.lm-compose__from{display:grid;grid-template-columns:minmax(200px,1fr) auto minmax(140px,1fr);align-items:center;gap:12px}.lm-compose__inline-label{font-size:13px;font-weight:600;color:#687584}.lm-compose__help{font-size:13px;color:#63717f;line-height:1.5;margin:3px 10px}.lm-compose__body{padding:18px 24px 10px}.lm-compose__body>label{display:block;padding:0 0 8px}.lm-compose textarea{display:block;resize:vertical;min-height:220px;line-height:1.6}.lm-compose__footer{border-top:1px solid #e8ecef;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 24px}.lm-compose__footer .lm-compose__help{margin:0}.lm-compose button[type=submit]{background:#235d9e;border:1px solid #235d9e;border-radius:6px;color:#fff;font:600 14px/1.3 system-ui,sans-serif;padding:12px 18px;min-height:44px;cursor:pointer;white-space:nowrap}.lm-compose button:disabled{opacity:.48;cursor:not-allowed}.lm-compose button:focus-visible{outline:3px solid #2783de;outline-offset:3px}.lm-compose__feedback{margin:0;padding:0 24px 20px;color:#304b66;font-size:14px}.lm-compose__feedback:empty{display:none}@media(max-width:640px){.lm-compose__header{height:auto;min-height:64px;padding:12px 18px}.lm-compose__main{padding:32px 16px 48px}.lm-compose__heading{align-items:flex-start}.lm-compose__heading h1{font-size:26px}.lm-compose__status-label{display:none}.lm-compose__row{grid-template-columns:1fr;gap:2px;padding:13px 16px}.lm-compose__row>label{padding-top:0}.lm-compose__from{grid-template-columns:1fr;gap:2px}.lm-compose__inline-label{padding:8px 10px 0}.lm-compose__body{padding:16px}.lm-compose textarea{min-height:200px}.lm-compose__footer{padding:16px;align-items:flex-start;flex-direction:column}.lm-compose button[type=submit]{width:100%}}
</style>
<script>
(function(){
 const page=document.getElementById('lm-compose-page'),form=document.getElementById('lm-compose-form'),send=document.getElementById('lm-compose-send'),status=document.getElementById('lm-compose-status');
 let busy=false,uncertain=false,dirty=false;
 function render(){const active=location.hash==='#compose';page.hidden=!active;document.body.classList.toggle('lm-compose-open',active);if(active)document.getElementById('lm-compose-title').focus();}
 window.lmOpenComposer=function(){location.hash='compose';if(location.hash==='#compose')render()};
 window.addEventListener('hashchange',render);render();
 form.addEventListener('input',()=>{dirty=true});
 document.getElementById('lm-compose-close').addEventListener('click',()=>{if(busy)return;if(dirty&&!confirm('Discard this message and return to the dashboard?'))return;form.reset();dirty=false;uncertain=false;send.disabled=false;status.textContent='';location.hash='';});
 window.addEventListener('beforeunload',event=>{if(dirty||busy){event.preventDefault();event.returnValue='';}});
 form.addEventListener('submit',async event=>{event.preventDefault();if(busy||uncertain)return;busy=true;send.disabled=true;status.textContent='Adding your message to the sending list…';const value=Object.fromEntries(new FormData(form));
 try{const response=await fetch('/api/admin/send',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({to:value.to,fromEmail:value.fromEmail,fromName:value.fromName,subject:value.subject,text:value.text})});const result=await response.json().catch(()=>({}));
 if(!response.ok){if(response.status>=500){uncertain=true;status.textContent=result.error||'The sending result could not be confirmed. Do not resend; check with an administrator.';}else status.textContent=result.error||'Could not add your message. Check the details and try again.';return;}
 status.textContent=result.message||'Your message was added to the sending list. Queue acceptance does not mean delivery.';form.reset();dirty=false;
 }catch{uncertain=true;status.textContent='The sending result could not be confirmed. Do not resend; check with an administrator.';}finally{busy=false;send.disabled=uncertain;}
 });
})();
</script>
