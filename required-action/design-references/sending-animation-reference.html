<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadMaster — Sending</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .lm-send{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 20px;text-align:center;max-width:320px;width:100%}
  .lm-send-svg{overflow:visible;display:block;width:100%;height:auto;max-width:280px}
  .lm-path{animation:lm-dash 1s linear infinite}
  @keyframes lm-dash{to{stroke-dashoffset:-14}}
  .lm-trail{animation:lm-pulse 1.2s ease-in-out infinite}
  @keyframes lm-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .lm-title{margin:0;font:600 15px/1.4 system-ui;color:#000}
  .lm-title b{font-weight:600}
  .lm-sub{margin:-8px 0 0;font:400 12px/1.4 system-ui;color:#6b7280;min-height:17px}
  .lm-steps{display:flex;align-items:center;gap:0;width:100%}
  .lm-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
  .lm-step .dot{width:26px;height:26px;border-radius:50%;border:1.8px solid #000;display:grid;place-items:center;background:#fff;color:#000}
  .lm-step .dot svg{width:14px;height:14px}
  .lm-step span{font:500 10px/1.2 system-ui;color:#6b7280;white-space:nowrap}
  .lm-step.active .dot{background:#000;color:#fff}
  .lm-step.active span{color:#000}
  .lm-step.done .dot{background:#000;color:#fff}
  .lm-line{flex:1;height:1.8px;background:#e5e5e5;margin:0 6px 18px;position:relative;overflow:hidden}
  .lm-line i{position:absolute;inset:0;background:#000;transform-origin:left;animation:lm-line 4.5s ease-in-out infinite}
  @keyframes lm-line{0%{transform:scaleX(0)}55%{transform:scaleX(1)}80%,100%{transform:scaleX(1);opacity:0}}
  .lm-bar{width:220px;height:3px;background:#e5e5e5;border-radius:99px;overflow:hidden}
  .lm-bar i{display:block;height:100%;width:40%;background:#000;border-radius:99px;animation:lm-bar 1.4s ease-in-out infinite}
  @keyframes lm-bar{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
  @media (prefers-reduced-motion:reduce){.lm-path,.lm-trail,.lm-line i,.lm-bar i{animation:none}}
</style>
</head>
<body>
<div class="lm-send" role="status" aria-label="Sending">
  <!-- HORIZONTAL FLIGHT: person -> curved path -> building | NO envelope, NO vertical stack -->
  <svg class="lm-send-svg" viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Sender: PERSON in circle (left) -->
    <circle cx="28" cy="45" r="16" fill="#fff" stroke="#000" stroke-width="1.8"/>
    <circle cx="28" cy="40" r="3.5" stroke="#000" stroke-width="1.8"/>
    <path d="M21 53a7 7 0 0 1 14 0" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Flight path: curved, dashed -->
    <path class="lm-path" d="M44 45 Q110 8 176 45" stroke="#000" stroke-width="1.8" stroke-dasharray="4 5" stroke-linecap="round"/>
    <!-- Recipient: BUILDING in circle (right) -->
    <circle cx="192" cy="45" r="16" fill="#fff" stroke="#000" stroke-width="1.8"/>
    <rect x="185" y="38" width="14" height="13" rx="1" stroke="#000" stroke-width="1.8"/>
    <path d="M188 42h2M192 42h2M188 46h2M192 46h2" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
    <!-- PAPER PLANE flying along path -->
    <g>
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M44 45 Q110 8 176 45" rotate="auto"/>
      <g class="lm-trail">
        <circle cx="-8" cy="2" r="1.2" fill="#000" opacity=".35"/>
        <circle cx="-13" cy="3" r="1" fill="#000" opacity=".2"/>
      </g>
      <path d="M0 -6 L10 0 L0 6 L3 0 Z" fill="#000" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M0 -6 L3 0 L0 6" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- Landing check pulse on building -->
    <circle cx="192" cy="45" r="16" stroke="#000" stroke-width="1" opacity="0">
      <animate attributeName="r" values="16;22" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </svg>
  <p class="lm-title">Sending<b class="dots">...</b></p>
  <p class="lm-sub" id="lmSub">Sending to recipient...</p>
  <div class="lm-steps" aria-hidden="true">
    <div class="lm-step active" id="s1"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg></span><span>Queued</span></div>
    <div class="lm-line"><i></i></div>
    <div class="lm-step" id="s2"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" stroke-linejoin="round"/></svg></span><span>Sending</span></div>
    <div class="lm-line"><i></i></div>
    <div class="lm-step" id="s3"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Delivered</span></div>
  </div>
  <div class="lm-bar"><i></i></div>
</div>
<script>
  const subs=["Encrypting...","Attaching...","Sending to recipient...","Delivered"];
  const steps=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];
  let i=0;
  setInterval(()=>{
    i=(i+1)%4;
    document.getElementById('lmSub').textContent=subs[i];
    steps.forEach((s,idx)=>{
      s.classList.toggle('active', idx===Math.min(i,2));
      s.classList.toggle('done', idx < i);
    });
    if(i===3){ setTimeout(()=>{ steps.forEach(s=>s.classList.remove('active','done')); steps[0].classList.add('active'); },900); }
  },1100);
</script>
</body>
</html>
